
<header class="page-header">
  <div>
    <h1>Nouveau ticket</h1>
    <p>Décrivez votre problème pour que notre équipe puisse vous aider.</p>
  </div>
</header>

<section class="form-section">
  <h2>Informations du ticket</h2>

  <p *ngIf="message" class="success-message">
  {{ message }}
</p>

<p *ngIf="errorMessage" class="error-message">
  {{ errorMessage }}
</p>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Sujet du ticket</label>
      <input
  id="title"
  name="title"
  type="text"
  [(ngModel)]="title"
  placeholder="Ex. : Mon ordinateur ne démarre plus"
  required
/>
    </div>

   
<div class="form-group">
  <label for="category">Catégorie</label>

  <select
    id="category"
    name="category"
    [(ngModel)]="category"
    required
  >
    <option value="">Sélectionnez une catégorie</option>
    <option value="hardware">Matériel informatique</option>
    <option value="software">Logiciel</option>
    <option value="network">Réseau et connexion</option>
    <option value="account">Compte utilisateur</option>
    <option value="other">Autre</option>
  </select>
</div>


    
<div class="form-group">
  <label for="priority">Priorité</label>

  <select
    id="priority"
    name="priority"
    [(ngModel)]="priority"
    required
  >
    <option value="">Sélectionnez une priorité</option>
    <option value="LOW">Faible</option>
    <option value="MEDIUM">Moyenne</option>
    <option value="HIGH">Élevée</option>
  </select>
</div>


    <div class="form-group">
      <label for="description">Description du problème</label>
     <textarea
  id="description"
  name="description"
  [(ngModel)]="description"
  rows="6"
  placeholder="Expliquez le problème rencontré..."
  required
></textarea>
    </div>

    <div class="form-actions">
      <a routerLink="/tickets" class="cancel-button">
        Annuler
      </a>

      <button type="submit" [disabled]="isLoading">
  {{ isLoading ? 'Création en cours...' : 'Créer le ticket' }}
</button>
    </div>
  </form>
  <p *ngIf="message">{{ message }}</p>
</section>
